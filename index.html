<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>計時器應用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .counter-box {
            background: #f5f5f5;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .counter-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        #counter {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #launchAppBtn {
            background: #667eea;
            color: white;
        }

        #launchAppBtn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #launchAppBtn:active {
            transform: translateY(0);
        }

        #resetBtn {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        #resetBtn:hover {
            background: #e0e0e0;
        }

        .info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>計時器</h1>
        
        <div class="counter-box">
            <div class="counter-label">經過的秒數</div>
            <div id="counter">0</div>
        </div>

        <div class="button-group">
            <button id="launchAppBtn">啟動 AllPay App</button>
            <button id="resetBtn">重置</button>
        </div>

        <div class="info">
            <p>計時器每秒自動增加 1</p>
        </div>
    </div>

    <script>
        let counter = 0;

        // 初始化計時器
        function initCounter() {
            setInterval(() => {
                counter++;
                document.getElementById('counter').textContent = counter;
            }, 1000);
        }

        // 啟動 AllPay App
        document.getElementById('launchAppBtn').addEventListener('click', () => {
            // 直接打開 allpay:// URL scheme
            window.location.href = 'allpay://';
            
            // 備用方案：如果直接跳轉失敗，延遲再試一次
            setTimeout(() => {
                window.location.href = 'allpay://';
            }, 1000);
        });

        // 重置計數器
        document.getElementById('resetBtn').addEventListener('click', () => {
            counter = 0;
            document.getElementById('counter').textContent = counter;
        });

        // 頁面加載時啟動計時器
        window.addEventListener('DOMContentLoaded', initCounter);
    </script>
</body>
</html>

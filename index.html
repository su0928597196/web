<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>計時器應用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .counter-box {
            background: #f5f5f5;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .counter-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        #counter {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
        }

        .notification {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #2e7d32;
            display: none;
            font-weight: 500;
        }

        .notification.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .notification.success {
            background: #e8f5e9;
            border-color: #4caf50;
            color: #2e7d32;
        }

        .notification.error {
            background: #ffebee;
            border-color: #f44336;
            color: #c62828;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #launchGwpayBtn {
            background: #667eea;
            color: white;
        }

        #launchGwpayBtn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #launchGwpayBtn:active {
            transform: translateY(0);
        }

        #launchGwpayBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #resetBtn {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        #resetBtn:hover {
            background: #e0e0e0;
        }

        .status-box {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }

        .status-item {
            margin: 5px 0;
        }

        .status-label {
            font-weight: 600;
            color: #333;
        }

        .info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>計時器應用</h1>
        
        <div id="notification" class="notification"></div>

        <div class="counter-box">
            <div class="counter-label">經過的秒數</div>
            <div id="counter">0</div>
        </div>

        <div class="button-group">
            <button id="launchGwpayBtn">打開 gwpay</button>
            <button id="resetBtn">重置</button>
        </div>

        <div class="status-box">
            <div class="status-item">
                <span class="status-label">App 狀態：</span>
                <span id="appStatus">未打開</span>
            </div>
            <div class="status-item">
                <span class="status-label">上次回調時間：</span>
                <span id="lastCallback">無</span>
            </div>
        </div>

        <div class="info">
            <p>計時器每秒自動增加 1</p>
            <p>打開 gwpay 後會回到此頁面並顯示通知</p>
        </div>
    </div>

    <script>
        let counter = 0;

        // 初始化計時器
        function initCounter() {
            setInterval(() => {
                counter++;
                document.getElementById('counter').textContent = counter;
            }, 1000);
        }

        // 顯示通知
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification show ${type}`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 更新狀態
        function updateStatus(appStatus, timestamp) {
            document.getElementById('appStatus').textContent = appStatus;
            if (timestamp) {
                document.getElementById('lastCallback').textContent = new Date(timestamp * 1000).toLocaleTimeString('zh-TW');
            }
        }

        // 檢查URL參數（回調）
        function checkUrlCallback() {
            const params = new URLSearchParams(window.location.search);
            const status = params.get('status');
            const timestamp = params.get('timestamp');

            if (status === 'done' || status === 'success') {
                updateStatus('已完成 ✓', timestamp);
                showNotification('gwpay 已完成操作！', 'success');
                
                // 清除URL參數（保持頁面乾淨）
                window.history.replaceState({}, document.title, window.location.pathname);
            } else if (status === 'cancel') {
                updateStatus('已取消', timestamp);
                showNotification('操作已取消', 'error');
                window.history.replaceState({}, document.title, window.location.pathname);
            } else if (status === 'error') {
                updateStatus('發生錯誤', timestamp);
                showNotification('gwpay 發生錯誤，請重試', 'error');
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        // 打開 gwpay app
        document.getElementById('launchGwpayBtn').addEventListener('click', () => {
            updateStatus('已打開...', null);
            
            // 生成當前頁面的回調URL
            const callbackUrl = window.location.origin + window.location.pathname + '?status=done&timestamp=' + Math.floor(Date.now() / 1000);
            
            // 打開 gwpay app，並帶上回調URL（可根據app實現調整）
            const gwpayUrl = 'gwpay://pay?callback=' + encodeURIComponent(callbackUrl);
            window.location.href = gwpayUrl;
        });

        // 重置計數器
        document.getElementById('resetBtn').addEventListener('click', () => {
            counter = 0;
            document.getElementById('counter').textContent = counter;
        });

        // 監聽頁面可見性（回到前景時）
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                checkUrlCallback();
            }
        });

        // 監聽頁面焦點（某些情況下觸發）
        window.addEventListener('focus', () => {
            checkUrlCallback();
        });

        // 頁面加載時檢查URL和啟動計時器
        window.addEventListener('DOMContentLoaded', () => {
            checkUrlCallback();
            initCounter();
        });
    </script>
</body>
</html>
